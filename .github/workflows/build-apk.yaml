name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Android project files are generated here, so the repo only holds the app's own code.
      - name: Create the Android project files
        run: |
          cp -r lib /tmp/lib_keep
          cp pubspec.yaml /tmp/pubspec_keep.yaml
          flutter create . --platforms=android --project-name celehub_app --org com.celehub
          rm -rf lib && cp -r /tmp/lib_keep lib
          cp /tmp/pubspec_keep.yaml pubspec.yaml
          rm -rf test

      - name: Allow internet and set the app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="CELEHub"#' "$M"
          grep -q "android.permission.INTERNET" "$M" || (echo "INTERNET permission was not added"; cat "$M"; exit 1)

      - name: Check the settings were filled in
        run: |
          if grep -q "YOUR-DOMAIN" lib/config.dart; then echo "Fill in siteUrl in lib/config.dart first."; exit 1; fi
          if grep -q "YOUR_TURNSTILE_SITE_KEY" lib/config.dart; then echo "Fill in turnstileSiteKey in lib/config.dart first."; exit 1; fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: celehub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
